file = "src/config.rs"
anchor = "config sections"
text = '''
/// Magic links (samples/auth-magic-link).
#[derive(Clone, Debug, Default)]
pub struct MagicLinkConfig {
    /// `APP_MAGIC_LINK_ANY_BROWSER=true` lets a link work in any browser. Off by default: a link
    /// works only where it was requested (the emailed code covers the other-device case), which
    /// stops login CSRF and forwarded links.
    pub any_browser: bool,
}

impl MagicLinkConfig {
    pub fn from_env(invalid: &mut Vec<String>) -> Self {
        let any_browser = match std::env::var("APP_MAGIC_LINK_ANY_BROWSER").ok().as_deref() {
            None | Some("") | Some("false") | Some("0") => false,
            Some("true") | Some("1") => true,
            Some(_) => {
                invalid.push("APP_MAGIC_LINK_ANY_BROWSER (expected true or false)".into());
                false
            }
        };
        Self { any_browser }
    }
}

'''

[[wire]]
file = "src/routes.rs"
anchor = "routes"
text = '''
// Magic links (auth-magic-link).
app = app
    .route("/login_links", axum::routing::post(crate::controllers::login_links::create))
    .route("/login_links/sent", get(crate::controllers::login_links::sent))
    .route("/login_links/code", axum::routing::post(crate::controllers::login_links::code))
    .route(
        "/login_links/{token}",
        get(crate::controllers::login_links::show).post(crate::controllers::login_links::consume),
    )
    .route("/account/confirm/email", axum::routing::post(crate::controllers::login_links::send_reauth_code))
    .route("/account/confirm/email/code", axum::routing::post(crate::controllers::login_links::confirm_reauth_code));
'''

