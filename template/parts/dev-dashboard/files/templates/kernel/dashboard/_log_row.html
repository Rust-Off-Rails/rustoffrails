<li class="log lvl-{{ l.level_class }}{% if !l.status_tone.is_empty() %} req tone-{{ l.status_tone }}{% endif %}" data-log-id="{{ l.id }}" data-level="{{ l.level_class }}"><time>{{ l.time }}</time><span class="lvl">{{ l.level }}</span><span class="target">{{ l.target }}</span><span class="msg">{{ l.message }}{% if !l.fields.is_empty() %} <span class="fields">{{ l.fields }}</span>{% endif %}</span>{% if let Some(t) = l.trace %}<a class="trace-link" href="/dev/dashboard/traces/{{ t }}">trace</a>{% endif %}</li>
