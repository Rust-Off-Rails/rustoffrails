# samples/dev-mailbox/sample.toml: the format is samples/FORMAT.md.
name = "dev-mailbox"
version = "0.7.0"
summary = "A live local inbox at /dev/mailbox: HTML/text/raw/headers, width and dark previews, codes and links with copy, attachments, search, checks, previews, JSON and a CLI. Development only."
depends_on = ["mailer"]
extracted_from = "Rust off Rails apps"

crates = []

