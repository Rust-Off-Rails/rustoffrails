// null while the table doesn't exist yet (a fresh database before `db migrate`).
out["mailbox"] = match crate::kernel::mailbox::counts(&state.db).await {
    Ok((total, unread)) => json!({ "total": total, "unread": unread, "latest": "/dev/mailbox/latest.json" }),
    Err(_) => Value::Null,
};
'''

