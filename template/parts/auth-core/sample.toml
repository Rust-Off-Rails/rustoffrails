file = "tests/app/support.rs"
anchor = "test support"
text = '''
/// Waits until background auth work (emails) has finished (auth-core).
pub async fn settle(&self) {
    self.state.background.idle().await;
}

/// Signs in as `user` without any sign-in method: a session row and its cookie (auth-core).
pub async fn sign_in_as(&self, user: &offrails_host::models::user::Model) -> String {
    let (_, raw) = offrails_host::models::session::start(
        &self.state.db,
        user.id,
        "test",
        None,
        None,
        chrono::Utc::now(),
    )
    .await
    .expect("start session");
    self.set_cookie(
        offrails_host::kernel::session::session_name(self.state.config.is_production()),
        &raw,
    );
    raw
}

/// Every email sent to `to` (after `settle`).
pub fn emails_to(&self, to: &str) -> Vec<offrails_host::kernel::mailer::Email> {
    self.state.mailer.sent().into_iter().filter(|m| m.to == to).collect()
}

/// The first link in `email`'s text part whose path starts with `prefix`, as a path.
pub fn link_in(&self, email: &offrails_host::kernel::mailer::Email, prefix: &str) -> String {
    let base = self.state.config.app_url.trim_end_matches('/').to_owned();
    email
        .text
        .split_whitespace()
        .filter_map(|w| w.strip_prefix(&base))
        .find(|p| p.starts_with(prefix))
        .unwrap_or_else(|| panic!("no {prefix} link in:\n{}", email.text))
        .to_owned()
}

