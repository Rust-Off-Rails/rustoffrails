/// A verified user (auth-core).
pub async fn user(db: &sea_orm::DatabaseConnection, email: &str) -> offrails_host::models::user::Model {
    let user = offrails_host::models::user::find_or_create(db, email, chrono::Utc::now())
        .await
        .expect("create user");
    offrails_host::models::user::mark_verified(db, user.id, chrono::Utc::now())
        .await
        .expect("verify user");
    offrails_host::models::user::find_self(db, user.id).await.expect("reload user")
}
'''

