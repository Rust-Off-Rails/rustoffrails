// Accounts (auth-core). Sign-in forms come from the method samples; see their routes below.
app = app
    .route("/session/new", get(crate::controllers::sessions::new))
    .route("/session/delete", axum::routing::post(crate::controllers::sessions::destroy))
    .route("/account", get(crate::controllers::account::show))
    .route("/account/confirm", get(crate::controllers::account::confirm))
    .route("/account/sessions/delete-others", axum::routing::post(crate::controllers::account::revoke_others))
    .route("/account/sessions/{id}/delete", axum::routing::post(crate::controllers::account::revoke))
    .route("/account/email/edit", get(crate::controllers::account::edit_email))
    .route("/account/email", axum::routing::post(crate::controllers::account::update_email))
    .route(
        "/account/email/confirm/{token}",
        get(crate::controllers::account::show_email_change)
            .post(crate::controllers::account::confirm_email_change),
    )
    .route(
        "/security/not-me/{token}",
        get(crate::controllers::security::show).post(crate::controllers::security::create),
    );
'''

