{% extends "layouts/application.html" %}
{% block content %}
<section class="mx-auto max-w-md">
  <div class="rounded-xl border border-red-200 dark:border-red-900 bg-white dark:bg-gray-900 p-6 shadow-sm sm:p-8">
    <div class="flex h-12 w-12 items-center justify-center rounded-full bg-red-50 dark:bg-red-950 text-red-600 dark:text-red-300">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-6 w-6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/></svg>
    </div>
    <h1 class="mt-4 text-2xl font-semibold tracking-tight">Secure your account</h1>
    <p class="mt-2 text-gray-700 dark:text-gray-300">This signs <strong class="font-medium text-gray-900 dark:text-gray-100">{{ email }}</strong> out on every device, including this one, and forgets every remembered device.</p>
    <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">Afterwards, sign in again and change your password if you use one.</p>
    <form method="post" action="{{ action }}" class="mt-6">
      <button class="inline-flex w-full items-center justify-center rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-gray-950">Sign out everywhere</button>
    </form>
  </div>
</section>
{% endblock %}
