{% extends "layouts/application.html" %}
{% block content %}
<section class="mx-auto max-w-md">
  <div class="rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-6 text-center shadow-sm sm:p-8">
    <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-300">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-6 w-6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3.75h.008M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
    </div>
    <h1 class="mt-4 text-2xl font-semibold tracking-tight">{{ heading }}</h1>
    <p class="mt-2 text-gray-700 dark:text-gray-300">{{ message }}</p>
    <p class="mt-6"><a href="{{ link_href }}" class="btn">{{ link_label }}</a></p>
  </div>
</section>
{% endblock %}
