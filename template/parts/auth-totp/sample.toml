[[wire]]
file = "src/tasks/auth_demo.rs"
anchor = "auth demo"
text = '''
// auth-totp: a second demo account with two-factor on, using the fixed, obviously fake demo
// secret (20 zero bytes: setup key AAAA AAAA …). The first account gets the same secret as a
// pending enrolment, so the setup page shows a known QR code.
crate::models::totp_credential::remove(&state.db, two_factor.id).await?;
crate::models::totp_credential::replace_pending(
    &state.db,
    &state.config.totp,
    two_factor.id,
    &crate::models::totp_credential::DEMO_SECRET,
    now,
)
.await?;
crate::models::totp_credential::enable(&state.db, two_factor.id, now).await?;
let codes = crate::models::recovery_code::regenerate(
    &state.db,
    &state.config.auth.secret_key,
    two_factor.id,
    now,
)
.await?;
println!("  recovery codes for {DEMO_2FA_EMAIL}: {}", codes.join(" "));
crate::models::totp_credential::remove(&state.db, user.id).await?;
crate::models::totp_credential::replace_pending(
    &state.db,
    &state.config.totp,
    user.id,
    &crate::models::totp_credential::DEMO_SECRET,
    now,
)
.await?;
println!("  two-factor: on for {DEMO_2FA_EMAIL}, with the fake DEMO setup key AAAA AAAA AAAA AAAA AAAA AAAA AAAA AAAA");
'''

