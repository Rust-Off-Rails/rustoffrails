# samples/auth-totp/sample.toml: the format is samples/FORMAT.md.
name = "auth-totp"
version = "0.7.0"
summary = "Two-factor authentication (TOTP, RFC 6238): enrol with a server-side QR code or setup key, confirm before enable, a code step after any sign-in method, replay protection, 10 hashed recovery codes, 'trust this device for 30 days', re-auth with a code, secrets encrypted at rest"
# Needs a sign-in method too: install auth-password or auth-magic-link (or both) as well.
depends_on = ["auth-core"]
extracted_from = "Rust off Rails apps"

# Run in the app root, one per line, never with a version (cargo add picks it; read Cargo.lock).
crates = [
  "totp-rs --features otpauth",
  "qrcode --no-default-features --features svg",
  "aes-gcm",
]

