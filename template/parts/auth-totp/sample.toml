[[wire]]
file = "src/config.rs"
anchor = "config sections"
text = '''
/// Two-factor (samples/auth-totp). `APP_TOTP_ENCRYPTION_KEY`: 32 bytes, base64
/// (`openssl rand -base64 32`), encrypts TOTP secrets at rest. During a key rotation, put the
/// old key in `APP_TOTP_ENCRYPTION_KEY_PREVIOUS`; secrets move to the new key as they're used.
#[derive(Clone)]
pub struct TotpConfig {
    pub key: [u8; 32],
    pub previous_key: Option<[u8; 32]>,
}

/// Development only, never accepted in production: TOTP secrets in a development database are
/// encrypted with this fixed, publicly known key.
const DEV_TOTP_KEY: [u8; 32] = *b"development-only-totp-key-000001";

impl TotpConfig {
    fn parse(name: &str, invalid: &mut Vec<String>) -> Option<[u8; 32]> {
        use base64::Engine;
        let raw = std::env::var(name).ok().filter(|v| !v.trim().is_empty())?;
        let decoded = base64::engine::general_purpose::STANDARD
            .decode(raw.trim())
            .ok()
            .and_then(|b| <[u8; 32]>::try_from(b.as_slice()).ok());
        if decoded.is_none() {
            invalid.push(format!("{name} (32 bytes, base64: openssl rand -base64 32)"));
        }
        decoded
    }

    pub fn from_env(env: AppEnv, missing: &mut Vec<String>, invalid: &mut Vec<String>) -> Self {
        let previous_key = Self::parse("APP_TOTP_ENCRYPTION_KEY_PREVIOUS", invalid);
        match Self::parse("APP_TOTP_ENCRYPTION_KEY", invalid) {
            Some(key) => Self { key, previous_key },
            None if env == AppEnv::Production => {
                if std::env::var("APP_TOTP_ENCRYPTION_KEY").is_err() {
                    missing.push("APP_TOTP_ENCRYPTION_KEY".into());
                }
                Self::test()
            }
            None => Self {
                key: DEV_TOTP_KEY,
                previous_key,
            },
        }
    }

    /// A random key per test config: no fixed secret in the test suite.
    pub fn test() -> Self {
        let mut key = [0u8; 32];
        rand::fill(&mut key);
        Self {
            key,
            previous_key: None,
        }
    }
}

impl std::fmt::Debug for TotpConfig {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        f.debug_struct("TotpConfig")
            .field("key", &"[redacted]")
            .field("previous_key", &self.previous_key.map(|_| "[redacted]"))
            .finish()
    }
}

'''

