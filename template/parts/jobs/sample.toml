// ----- jobs (.offrails/guides/jobs.md#testing-obantesting-equivalents) -----

/// Runs every due job through the real kernel path until none are due.
pub async fn drain_jobs(&self) -> offrails_host::kernel::jobs::Drained {
    self.drain(None, false).await
}

/// `drain_jobs` for one queue.
pub async fn drain_queue(&self, queue: &str) -> offrails_host::kernel::jobs::Drained {
    self.drain(Some(queue), false).await
}

/// Also runs `scheduled` jobs as if their time had come (each once per drain).
pub async fn drain_all_jobs(&self) -> offrails_host::kernel::jobs::Drained {
    self.drain(None, true).await
}

async fn drain(
    &self,
    queue: Option<&str>,
    include_scheduled: bool,
) -> offrails_host::kernel::jobs::Drained {
    offrails_host::kernel::jobs::drain(
        self.db(),
        &offrails_host::jobs::dispatch_fn(self.state.clone()),
        offrails_host::jobs::worker_config,
        queue,
        include_scheduled,
    )
    .await
    .expect("drain jobs")
}

/// `available`/`scheduled` jobs of `W`, with their decoded args.
pub async fn enqueued<W: offrails_host::jobs::Worker>(
    &self,
) -> Vec<(offrails_host::kernel::jobs::job::Model, W)> {
    use offrails_host::kernel::jobs::{JobState, job};
    use sea_orm::{ColumnTrait, EntityTrait, QueryFilter, QueryOrder};
    job::Entity::find()
        .filter(job::Column::Worker.eq(W::NAME))
        .filter(job::Column::State.is_in([JobState::Available, JobState::Scheduled]))
        .order_by_asc(job::Column::Id)
        .all(self.db())
        .await
        .expect("enqueued jobs")
        .into_iter()
        .map(|row| {
            let args = serde_json::from_value(row.args.clone()).expect("args decode");
            (row, args)
        })
        .collect()
}

/// Panics, listing what is enqueued, unless an `available`/`scheduled` `W` matches.
pub async fn assert_enqueued<W: offrails_host::jobs::Worker + std::fmt::Debug>(
    &self,
    pred: impl Fn(&W) -> bool,
) {
    let jobs = self.enqueued::<W>().await;
    assert!(
        jobs.iter().any(|(_, w)| pred(w)),
        "no matching {} enqueued; enqueued: {:?}",
        W::NAME,
        jobs.iter().map(|(_, w)| w).collect::<Vec<_>>()
    );
}

/// Panics if any `available`/`scheduled` `W` exists.
pub async fn refute_enqueued<W: offrails_host::jobs::Worker>(&self) {
    let jobs = self.enqueued::<W>().await;
    assert!(jobs.is_empty(), "{} {} enqueued", jobs.len(), W::NAME);
}

/// Round-trips `w` through JSON (catching serde mistakes), then runs `perform` once.
pub async fn perform_job<W: offrails_host::jobs::Worker>(
    &self,
    w: W,
) -> anyhow::Result<offrails_host::kernel::jobs::Outcome> {
    let json = serde_json::to_value(&w).expect("args serialize");
    let w: W = serde_json::from_value(json).expect("args round-trip");
    let info = offrails_host::kernel::jobs::JobInfo::synthetic(W::NAME, W::QUEUE);
    w.perform(&info, &self.state).await
}

