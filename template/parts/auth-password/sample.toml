text = '''
/// The password every `user_with_password` gets (auth-password). Fake, for tests only.
pub const PASSWORD: &str = "violet tractor sandwich";

/// A verified user with `PASSWORD`, hashed once per test binary (argon2 is slow on purpose).
pub async fn user_with_password(
    db: &sea_orm::DatabaseConnection,
    email: &str,
) -> offrails_host::models::user::Model {
    static DIGEST: tokio::sync::OnceCell<String> = tokio::sync::OnceCell::const_new();
    let digest = DIGEST
        .get_or_init(|| async {
            offrails_host::models::password_credential::hash(PASSWORD.to_owned())
                .await
                .expect("hash")
        })
        .await
        .clone();
    let user = user(db, email).await;
    offrails_host::models::password_credential::set(db, user.id, digest, chrono::Utc::now())
        .await
        .expect("set password");
    user
}
'''
