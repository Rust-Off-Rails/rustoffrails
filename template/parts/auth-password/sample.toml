# samples/auth-password/sample.toml: the format is samples/FORMAT.md.
name = "auth-password"
version = "0.7.0"
summary = "Email + password: argon2id (OWASP parameters, rehash on sign-in), sign-up with email verification, sign-in with progressive per-account delays, reset by single-use link, change password, a bundled common-password check and a live strength meter that works without JS"
depends_on = ["auth-core"]
extracted_from = "Rust off Rails apps"

# Run in the app root, one per line, never with a version (cargo add picks it; read Cargo.lock).
crates = [
  "argon2",
]

