[[wire]]
file = "src/routes.rs"
anchor = "routes"
text = '''
// Passwords (auth-password).
app = app
    .route("/session/password", axum::routing::post(crate::controllers::password_sessions::create))
    .route("/account/confirm/password", axum::routing::post(crate::controllers::password_sessions::confirm))
    .route("/registration/new", get(crate::controllers::registrations::new))
    .route("/registration", axum::routing::post(crate::controllers::registrations::create))
    .route("/registration/sent", get(crate::controllers::registrations::sent))
    .route(
        "/email-verification/{token}",
        get(crate::controllers::registrations::verification)
            .post(crate::controllers::registrations::verify),
    )
    .route("/passwords/new", get(crate::controllers::passwords::new))
    .route("/passwords", axum::routing::post(crate::controllers::passwords::create))
    .route("/passwords/sent", get(crate::controllers::passwords::sent))
    .route("/passwords/{token}/edit", get(crate::controllers::passwords::edit))
    .route("/passwords/{token}", axum::routing::post(crate::controllers::passwords::update))
    .route("/password-strength", axum::routing::post(crate::controllers::passwords::strength))
    .route("/account/password/edit", get(crate::controllers::account_passwords::edit))
    .route("/account/password", axum::routing::post(crate::controllers::account_passwords::update));
'''

