[[wire]]
file = "src/config.rs"
anchor = "config sections"
text = '''
/// Realtime (samples/realtime). GUIDE: .offrails/guides/channels.md#transports
#[derive(Clone)]
pub struct RealtimeConfig {
    /// `APP_REALTIME_TRANSPORTS` (default `websocket,sse,longpoll`): what the server offers.
    /// Behind a proxy that breaks WebSockets, drop `websocket`; clients fall back by themselves.
    pub transports: Vec<String>,
    /// `APP_REALTIME_REVALIDATE_SECS` (60): how often a live connection re-checks its session.
    pub revalidate: Duration,
    /// `APP_REALTIME_SECRET` (32+ characters): signs socket tokens for clients that can't send
    /// the session cookie. Unset: socket tokens are off (development makes one per boot).
    pub secret: Option<String>,
    /// `APP_REALTIME_ORIGINS`: origins, besides APP_URL's, a token-authenticated socket may come
    /// from (comma-separated, exact `scheme://host[:port]`).
    pub token_origins: Vec<String>,
    /// `APP_CLUSTER` (false): several nodes share presence and broadcasts over Postgres
    /// LISTEN/NOTIFY. Postgres only.
    pub cluster: bool,
    /// `APP_NODE`: this node's name on /dev/sockets (default `<host>:<pid>`).
    pub node: Option<String>,
}

impl RealtimeConfig {
    fn parse(
        get: &dyn Fn(&str) -> Option<String>,
        invalid: &mut Vec<String>,
        env: AppEnv,
        database_url: &str,
    ) -> Self {
        let list = |v: String| -> Vec<String> {
            v.split(',')
                .map(|s| s.trim().to_owned())
                .filter(|s| !s.is_empty())
                .collect()
        };
        let transports = get("APP_REALTIME_TRANSPORTS")
            .map(list)
            .unwrap_or_else(|| vec!["websocket".into(), "sse".into(), "longpoll".into()]);
        if transports.is_empty()
            || transports
                .iter()
                .any(|t| !matches!(t.as_str(), "websocket" | "sse" | "longpoll"))
        {
            invalid.push("APP_REALTIME_TRANSPORTS (websocket, sse and/or longpoll)".into());
        }
        let revalidate = match get("APP_REALTIME_REVALIDATE_SECS").map(|v| v.parse::<u64>()) {
            None => 60,
            Some(Ok(n)) if n >= 1 => n,
            Some(_) => {
                invalid.push("APP_REALTIME_REVALIDATE_SECS (a number of seconds, 1 or more)".into());
                60
            }
        };
        let secret = match get("APP_REALTIME_SECRET") {
            Some(s) if s.len() < crate::kernel::socket_token::MIN_SECRET => {
                invalid.push("APP_REALTIME_SECRET (at least 32 characters)".into());
                None
            }
            Some(s) => Some(s),
            // Development: a fresh secret per boot, so socket tokens work locally.
            None if env == AppEnv::Development => Some(format!(
                "{:032x}{:032x}",
                rand::random::<u128>(),
                rand::random::<u128>()
            )),
            None => None,
        };
        let token_origins = get("APP_REALTIME_ORIGINS").map(list).unwrap_or_default();
        if token_origins
            .iter()
            .any(|o| !(o.starts_with("https://") || o.starts_with("http://")) || o.ends_with('/'))
        {
            invalid.push("APP_REALTIME_ORIGINS (scheme://host[:port], comma-separated)".into());
        }
        let cluster = match get("APP_CLUSTER").as_deref() {
            None | Some("false") | Some("0") => false,
            Some("true") | Some("1") => true,
            Some(_) => {
                invalid.push("APP_CLUSTER (expected true or false)".into());
                false
            }
        };
        if cluster && !database_url.starts_with("postgres") {
            invalid.push("APP_CLUSTER (needs a postgres:// DATABASE_URL)".into());
        }
        Self {
            transports,
            revalidate: Duration::from_secs(revalidate),
            secret,
            token_origins,
            cluster,
            node: get("APP_NODE"),
        }
    }

    /// The test suite's realtime config: every transport, a fixed token secret.
    pub fn test() -> Self {
        Self {
            transports: vec!["websocket".into(), "sse".into(), "longpoll".into()],
            revalidate: Duration::from_secs(60),
            secret: Some("t".repeat(32)),
            token_origins: Vec::new(),
            cluster: false,
            node: Some("test".into()),
        }
    }
}

// The secret lives here, so Debug is hand-written.
impl fmt::Debug for RealtimeConfig {
    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
        f.debug_struct("RealtimeConfig")
            .field("transports", &self.transports)
            .field("revalidate", &self.revalidate)
            .field("secret", &self.secret.as_ref().map(|_| "[redacted]"))
            .field("token_origins", &self.token_origins)
            .field("cluster", &self.cluster)
            .field("node", &self.node)
            .finish()
    }
}
'''

