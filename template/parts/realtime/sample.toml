# samples/realtime/sample.toml: the format is samples/FORMAT.md.
name = "realtime"
version = "0.7.0"
summary = "Channels over WebSocket (offrails.v1) with SSE and long-poll fallbacks: typed rooms, topic authorization on every join and push, presence across tabs and nodes, resume after reconnect, signed socket tokens, revocation, per-user caps, tuned buffers, a live room demo and /dev/sockets"
# Works on a blank app with development guests (src/channels/identity.rs); point that file at an
# auth sample's sessions when the app has accounts (README, "Adapting it").
depends_on = []
extracted_from = "Rust off Rails apps"

# Run in the app root, one per line, never with a version (cargo add picks it; read Cargo.lock).
crates = [
  "axum --features ws",
  "hmac",
  "--dev tokio-tungstenite",
]

