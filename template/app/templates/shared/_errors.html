{% if !errors.is_empty() %}
<div role="alert" class="errors mb-6 rounded-md border border-red-200 dark:border-red-900 bg-red-50 dark:bg-red-950 p-4 text-sm text-red-800 dark:text-red-200">
  <p class="font-medium">Please fix the following:</p>
  <ul class="mt-1 list-disc pl-5">
    {% for message in errors.full_messages() %}<li>{{ message }}</li>{% endfor %}
  </ul>
</div>
{% endif %}
