<!doctype html>
<html lang="en" data-theme="{{ theme.as_str() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{ theme.color_scheme() }}">
  <title>Something went wrong</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body class="min-h-screen bg-white text-gray-900 dark:bg-gray-950 dark:text-gray-100 antialiased">
  <main class="mx-auto max-w-xl px-4 py-24 text-center">
    <p class="text-sm font-medium text-gray-600 dark:text-gray-400">500</p>
    <h1 class="mt-2 text-3xl font-semibold tracking-tight">Something went wrong</h1>
    <p class="mt-3 text-gray-700 dark:text-gray-300">We hit an error on our side. Try again in a moment.</p>
    {% if let Some(detail) = detail %}<pre class="mt-6 overflow-x-auto rounded-md bg-gray-100 dark:bg-gray-800 p-4 text-left text-xs text-gray-800 dark:text-gray-200">{{ detail }}</pre>{% endif %}
    <p class="mt-8"><a class="link" href="/">Back to the home page</a></p>
  </main>
</body>
</html>
