# `cargo offrails <command>`: the framework's generators (add-part, list-parts), built from the
# vendored .offrails/tools/offrails-gen with the standard library only. Works on Linux, macOS and
# Windows; run it from the app root. Its build output stays in target/offrails-gen.
[alias]
offrails = "run -q --manifest-path .offrails/tools/offrails-gen/Cargo.toml --target-dir target/offrails-gen --"
