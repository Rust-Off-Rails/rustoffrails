name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  docs-and-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Markdown links and anchors resolve
        run: python3 tools/ci/check-links.py
      - name: Plugin hooks behave
        run: bash tools/ci/test-hooks.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Plugin manifests, skills and hooks validate
        run: npx -y @anthropic-ai/claude-code@2.1.296 plugin validate . --strict
      - name: The boosted-navigation smoke catches a button that is dead after a boosted link (the runner's Chrome)
        run: node tools/browser-smoke/selftest-boosted.mjs
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck (installer, offrails command, offrails-check, generators' wrappers, release + CI scripts)
        run: shellcheck -s sh install.sh tools/offrails tools/offrails-check tools/new-app.sh tools/sync-parts.sh tools/release/release.sh tools/ci/test-install.sh tools/ci/test-offrails-check.sh tools/ci/test-template.sh tools/ci/memory-budget.sh tools/browser-smoke/run.sh
      - name: offrails-check passes a complete app and fails each broken fixture with its message
        run: sh tools/ci/test-offrails-check.sh
      - name: Install into this runner and clean containers (ubuntu:24.04, debian:trixie-slim)
        run: tools/ci/test-install.sh
  template:                     # the app template and every part, on both databases (tools/ci/test-template.sh)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "template/app -> ${{ runner.temp }}/template-ci/target" }
      - uses: taiki-e/install-action@nextest
      - name: Generate bare, all parts, and parts added one by one; fmt, clippy, tests on SQLite and Postgres, offrails-check, memory budget
        run: OFFRAILS_CI_DIR="${{ runner.temp }}/template-ci" sh tools/ci/test-template.sh
  template-os:                  # the generators and the app build and pass their SQLite suite on every OS
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        parts: [none, all]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "${{ runner.temp }}/gen-app" }
      - uses: taiki-e/install-action@nextest
      - name: offrails-gen tests
        run: cargo test -q --manifest-path tools/offrails-gen/Cargo.toml
      - name: Generate the app (parts=${{ matrix.parts }})
        shell: bash
        run: cargo run -q --manifest-path tools/offrails-gen/Cargo.toml --target-dir "$RUNNER_TEMP/gen-target" -- new "$RUNNER_TEMP/gen-app" gen_app "Gen App" --parts ${{ matrix.parts }}
      - name: fmt, clippy
        shell: bash
        working-directory: ${{ runner.temp }}/gen-app
        run: cargo fmt --all --check && cargo clippy -q --all-targets -- -D warnings
      - name: list-parts and a re-run of add-part through the app's alias (no-op)
        if: matrix.parts == 'all'
        shell: bash
        working-directory: ${{ runner.temp }}/gen-app
        run: |
          git add -A && git -c user.name=ci -c user.email=ci@example.invalid commit -qm baseline
          cargo offrails list-parts
          cargo offrails add-part mailer jobs-dashboard
          test -z "$(git status --porcelain)"
      - name: Tests (SQLite)
        working-directory: ${{ runner.temp }}/gen-app
        # One retry: two dev-dashboard tests share on-disk state under a parallel run (a samples bug;
        # the template job allows the retry for those two names only).
        run: cargo nextest run --no-fail-fast --retries 1
